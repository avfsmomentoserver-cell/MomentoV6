[project]
name = "momento-backend"
version = "7.0.0"
description = "Momento AFRESH backend: FastAPI on momento_core + ported v6.5 intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "pydantic>=2.6",
]

[project.optional-dependencies]
core = ["sqlalchemy>=2.0", "pandas>=2.0", "scipy>=1.11"]   # legacy momento_core db/api layer + its tests
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests", "momento_core/tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning", "ignore::UserWarning"]
