#:schema node_modules/wrangler/config-schema.json
name = "momento-v6"
main = "index.ts"
workers_dev = false
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Local dev server settings
[dev]
port = 8000
ip = "0.0.0.0"
local_protocol = "http"

# Durable Object - MomentoCore
[[durable_objects.bindings]]
name = "DO"
class_name = "MomentoCore"

# Migrations - create the Durable Object
[[migrations]]
tag = "v1"
new_classes = ["MomentoCore"]
